# Publications, newest first.
# featured: true  -> shown as a "Key publication" with summary and image
# preprint: free preprint link, shown as "Free preprint" (handy when the journal version is paywalled)
# padded: false -> removes the white space between a figure and its coloured frame
# image: path under public/, e.g. /images/pubs/tenk10k.png (optional; a coloured tile is used otherwise)
# topic: which group it appears under on the Research page (see topics.yaml)
# links: extra links shown as coloured chips under the paper. The colour follows the label:
#   "Code" (teal) · "Analysis code" / "Pipeline" (light teal) · "Data" (plum) · "Website" / "Docs" / "Browser" (plum outline)
#   e.g.
#   links:
#     - label: "Code"
#       url: "https://github.com/..."
#     - label: "Data"
#       url: "https://zenodo.org/records/..."
#     - label: "Website"
#       url: "https://..."
# rank: optional tie-breaker within a year (1 comes first)
# review: true  -> labelled "Review"
# Authors: * = joint first, # = corresponding.
# Your name is highlighted automatically in the author list.

